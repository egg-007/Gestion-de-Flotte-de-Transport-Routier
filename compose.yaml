services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/gestion_flotte
      JWT_SECRET: change_this_secret_before_production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./src:/app/src
volumes:
  mongo_data:
